name: pr docker smoke

# Paths-filtered companion to pr.yml — runs only when a PR touches
# the container image artifacts or the CLI entrypoint code that can
# break the mock-container behaviour (ADR 0018 §Verification).
# Other PRs do not trigger this workflow, so 99% of changes stay on
# the fast build-and-test path in pr.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'src/IviCli.Cli/**'
      - '.github/workflows/pr-docker-smoke.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-docker-smoke-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: docker / mock-VISA smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Publish self-contained linux-x64
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./artifacts/linux-x64-selfcontained

      - name: Build single-arch image (no push)
        run: |
          docker build -f docker/Dockerfile \
            --build-arg RID=linux-x64 \
            --tag ivi-cli-mock:pr-smoke .

      - name: Smoke test (HEALTHCHECK + SCPI roundtrip)
        run: sh docker/smoke-test.sh ivi-cli-mock:pr-smoke

  # NativeAOT flavor (issue #15). The image compiles inside its build
  # stage, so the job needs Docker only. amd64 only: ILC under QEMU is
  # not viable, and the arm64 half is built and smoked on a native arm
  # runner in release.yml before it reaches the published index.
  docker-smoke-aot:
    name: docker / mock-VISA smoke (NativeAOT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build NativeAOT image (publishes inside the build stage)
        run: docker build -f docker/Dockerfile.aot --tag ivi-cli-mock:pr-smoke-aot .

      - name: Smoke test (HEALTHCHECK + SCPI + VXI-11 roundtrip)
        run: sh docker/smoke-test.sh ivi-cli-mock:pr-smoke-aot

      - name: Report compressed image size
        run: docker save ivi-cli-mock:pr-smoke-aot | gzip | wc -c

  # Native-arm64 twin of the amd64 JIT job. Before this job existed, the
  # only arm64 execution of the container was the release-tag gate in
  # release.yml, so an arm64-timing bug could hide until a release run.
  docker-smoke-arm64:
    name: docker / mock-VISA smoke (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Publish self-contained linux-arm64
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r linux-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./artifacts/linux-arm64-selfcontained

      - name: Build single-arch image (no push)
        run: |
          docker build -f docker/Dockerfile \
            --build-arg RID=linux-arm64 \
            --tag ivi-cli-mock:pr-smoke-arm64 .

      - name: Smoke test x10 (startup-race stress)
        run: |
          fails=0
          for i in $(seq 1 10); do
            echo "=== round $i ==="
            if ! sh docker/smoke-test.sh ivi-cli-mock:pr-smoke-arm64; then
              fails=$((fails+1))
            fi
          done
          echo "failed rounds: $fails/10"
          [ "$fails" -eq 0 ] || exit 1
