name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pr-title-validation:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            build
            ci
            hotfix

  docs-sync-check:
    name: PRD/README/CONTRIBUTING i18n sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify bilingual doc pairs modified together
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          check_pair() {
            local en_path="$1"
            local jp_path="$2"
            local en=0
            local jp=0
            echo "$changed" | grep -qx "$en_path" && en=1 || true
            echo "$changed" | grep -qx "$jp_path" && jp=1 || true
            # JP mirror may not yet exist; skip gating until it does.
            if [ -f "$jp_path" ] && [ "$en" -ne "$jp" ]; then
              echo "::error::$en_path and $jp_path must be modified in the same PR (ADR 0024 §4)."
              exit 1
            fi
          }
          check_pair 'docs/PRD.md' 'docs/PRD.jp.md'
          check_pair 'README.md' 'README.jp.md'
          check_pair 'CONTRIBUTING.md' 'CONTRIBUTING.jp.md'

  build-and-test:
    name: build / format / analyzers / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Format check (CSharpier)
        run: dotnet csharpier check .

      - name: Analyzer rule check
        run: dotnet format analyzers --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit + architecture)
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e75e3c0cd0a # v5.1.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./TestResults
          fail_ci_if_error: false
