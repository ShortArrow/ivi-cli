name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pr-title-validation:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            build
            ci
            hotfix

  docs-sync-check:
    name: PRD/README/CONTRIBUTING i18n sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify bilingual doc pairs modified together
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          check_pair() {
            local en_path="$1"
            local jp_path="$2"
            local en=0
            local jp=0
            echo "$changed" | grep -qx "$en_path" && en=1 || true
            echo "$changed" | grep -qx "$jp_path" && jp=1 || true
            # JP mirror may not yet exist; skip gating until it does.
            if [ -f "$jp_path" ] && [ "$en" -ne "$jp" ]; then
              echo "::error::$en_path and $jp_path must be modified in the same PR (ADR 0024 §4)."
              exit 1
            fi
          }
          check_pair 'docs/PRD.md' 'docs/PRD.jp.md'
          check_pair 'README.md' 'docs/README.jp.md'
          check_pair 'docs/CONTRIBUTING.md' 'docs/CONTRIBUTING.jp.md'

  version-changelog-sync:
    name: version / CHANGELOG sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version has a matching CHANGELOG entry
        shell: bash
        run: |
          set -euo pipefail
          props="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          if ! grep -qF "## [$props]" docs/CHANGELOG.md; then
            echo "::error::Directory.Build.props <Version> ($props) has no matching '## [$props]' section in docs/CHANGELOG.md."
            exit 1
          fi
          echo "sync ok: <Version> $props has a CHANGELOG entry"

  notices-sync:
    name: third-party notices sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every shipped package has an attribution entry
        shell: bash
        run: |
          set -euo pipefail
          # The CLI's lock file is the closure that reaches a user's machine:
          # its packages become the assemblies published beside `ivicli` in
          # the release archives, the container image, and the tool package.
          # Build-task packages (PrivateAssets=all) never reach the
          # published output, so they need no attribution entry:
          # Microsoft.NET.ILLink.Tasks backs the trim/AOT analyzers.
          jq -r '.dependencies[] | to_entries[]
                 | select(.value.type != "Project") | .key' \
            src/IviCli.Cli/packages.lock.json | tr -d '\r' \
            | grep -vx 'Microsoft.NET.ILLink.Tasks' | sort -u > /tmp/shipped.txt
          sed -n 's/^- `\([A-Za-z0-9_.]*\)`.*/\1/p' THIRD-PARTY-NOTICES.md \
            | tr -d '\r' | sort -u > /tmp/attributed.txt
          missing="$(comm -23 /tmp/shipped.txt /tmp/attributed.txt)"
          stale="$(comm -13 /tmp/shipped.txt /tmp/attributed.txt)"
          status=0
          if [ -n "$missing" ]; then
            echo "::error::THIRD-PARTY-NOTICES.md has no entry for: $(echo "$missing" | tr '\n' ' ')"
            echo "::error::Read each package's license from the project itself — several declare none in their NuGet metadata."
            status=1
          fi
          if [ -n "$stale" ]; then
            echo "::error::THIRD-PARTY-NOTICES.md attributes packages that are no longer shipped: $(echo "$stale" | tr '\n' ' ')"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "notices ok: $(wc -l < /tmp/shipped.txt) shipped packages, all attributed"
          fi
          exit "$status"

  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          # Docs-only = every changed path is a *.md file or lives under docs/.
          # Anything else (code, csproj, Dockerfile, workflows, …) needs the build.
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Docker lint only when the Dockerfile, its build context, or the
          # hadolint config changed.
          if echo "$changed" | grep -qE '(^docker/|Dockerfile|\.hadolint\.ya?ml$)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files:"; echo "$changed"

  hadolint:
    name: hadolint (Dockerfile)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint docker/Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml
      - name: Lint docker/Dockerfile.aot
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/Dockerfile.aot
          config: .hadolint.yaml

  build-and-test:
    name: build / format / analyzers / test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Format check (CSharpier)
        run: dotnet csharpier check .

      - name: Analyzer rule check
        run: dotnet format analyzers --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit + architecture)
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./TestResults
          fail_ci_if_error: false
