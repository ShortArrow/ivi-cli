name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, 'release/**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pr-title-validation:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            build
            ci
            hotfix

  docs-sync-check:
    name: PRD/README/CONTRIBUTING i18n sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify bilingual doc pairs modified together
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          check_pair() {
            local en_path="$1"
            local jp_path="$2"
            local en=0
            local jp=0
            echo "$changed" | grep -qx "$en_path" && en=1 || true
            echo "$changed" | grep -qx "$jp_path" && jp=1 || true
            # JP mirror may not yet exist; skip gating until it does.
            if [ -f "$jp_path" ] && [ "$en" -ne "$jp" ]; then
              echo "::error::$en_path and $jp_path must be modified in the same PR (ADR 0024 §4)."
              exit 1
            fi
          }
          check_pair 'docs/PRD.md' 'docs/PRD.jp.md'
          check_pair 'README.md' 'docs/README.jp.md'
          check_pair 'docs/CONTRIBUTING.md' 'docs/CONTRIBUTING.jp.md'
          check_pair 'docs/conformance.md' 'docs/conformance.jp.md'

  version-changelog-sync:
    name: version / CHANGELOG sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version has a matching CHANGELOG entry
        shell: bash
        run: |
          set -euo pipefail
          props="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          if ! grep -qF "## [$props]" docs/CHANGELOG.md; then
            echo "::error::Directory.Build.props <Version> ($props) has no matching '## [$props]' section in docs/CHANGELOG.md."
            exit 1
          fi
          echo "sync ok: <Version> $props has a CHANGELOG entry"

  notices-sync:
    name: third-party notices sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every shipped package has an attribution entry
        shell: bash
        run: |
          set -euo pipefail
          # The CLI's lock file is the closure that reaches a user's machine:
          # its packages become the assemblies published beside `ivicli` in
          # the release archives, the container image, and the tool package.
          # Build-task packages (PrivateAssets=all) never reach the
          # published output, so they need no attribution entry:
          # Microsoft.NET.ILLink.Tasks backs the trim/AOT analyzers.
          jq -r '.dependencies[] | to_entries[]
                 | select(.value.type != "Project") | .key' \
            src/IviCli.Cli/packages.lock.json | tr -d '\r' \
            | grep -vx 'Microsoft.NET.ILLink.Tasks' | sort -u > /tmp/shipped.txt
          sed -n 's/^- `\([A-Za-z0-9_.-]*\)`.*/\1/p' THIRD-PARTY-NOTICES.md \
            | tr -d '\r' | sort -u > /tmp/attributed.txt
          missing="$(comm -23 /tmp/shipped.txt /tmp/attributed.txt)"
          stale="$(comm -13 /tmp/shipped.txt /tmp/attributed.txt)"
          status=0
          if [ -n "$missing" ]; then
            echo "::error::THIRD-PARTY-NOTICES.md has no entry for: $(echo "$missing" | tr '\n' ' ')"
            echo "::error::Read each package's license from the project itself — several declare none in their NuGet metadata."
            status=1
          fi
          if [ -n "$stale" ]; then
            echo "::error::THIRD-PARTY-NOTICES.md attributes packages that are no longer shipped: $(echo "$stale" | tr '\n' ' ')"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "notices ok: $(wc -l < /tmp/shipped.txt) shipped packages, all attributed"
          fi
          exit "$status"

  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
      apt: ${{ steps.filter.outputs.apt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          # Docs-only = every changed path is a *.md file or lives under docs/.
          # Anything else (code, csproj, Dockerfile, workflows, …) needs the build,
          # and so does the conformance document, which is checked against the
          # tests (ADR 0054).
          if echo "$changed" | grep -qvE '(\.md$|^docs/)' \
            || echo "$changed" | grep -qE '^docs/conformance(\.jp)?\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Docker lint only when the Dockerfile, its build context, or the
          # hadolint config changed.
          if echo "$changed" | grep -qE '(^docker/|Dockerfile|\.hadolint\.ya?ml$)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          # The .deb install test (ADR 0052 §4) when the packaging, the
          # workflows that build it, or what decides the published binary
          # changed.
          if echo "$changed" | grep -qE '^(packaging/apt/|src/|Directory\.Build\.props$|Directory\.Packages\.props$|global\.json$|\.github/workflows/(pr|release)\.yml$)'; then
            echo "apt=true" >> "$GITHUB_OUTPUT"
          else
            echo "apt=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files:"; echo "$changed"

  hadolint:
    name: hadolint (Dockerfile)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint docker/Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml
      - name: Lint docker/Dockerfile.aot
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile.aot
          config: .hadolint.yaml

  build-and-test:
    name: build / format / analyzers / test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Format check (CSharpier)
        run: dotnet csharpier check .

      - name: Release channel rules
        run: bash .github/scripts/release-channel.test.sh

      - name: Analyzer rule check
        run: dotnet format analyzers --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The Serial backend's tests stand a socat pseudo-terminal pair in
      # for a serial port (ADR 0055 §11); without socat they are skipped.
      - name: Install socat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq socat

      - name: Conformance document against the tests' Spec traits
        run: |
          set -euo pipefail
          bash .github/scripts/spec-trace.test.sh
          for project in tests/*.Tests; do
            name="$(basename "$project")"
            dotnet "$(ls "$project"/bin/Release/*/"$name".dll)" --list-tests json
          done \
            | jq -r '.tests[] | .displayName as $test | .traits[]? | select(.key == "Spec") | "\(.value)\t\($test)"' \
            >"$RUNNER_TEMP/spec-tags.tsv"
          bash .github/scripts/spec-trace.sh "$RUNNER_TEMP/spec-tags.tsv" docs/conformance.md docs/conformance.jp.md

      - name: Test (unit + architecture)
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=Integration" \
            --coverlet --coverlet-output-format cobertura \
            --coverlet-include "[IviCli.*]*" --coverlet-include "[ivicli]*" \
            --coverlet-exclude "[IviCli.TestKit]*" --coverlet-exclude "[IviCli.Plugin.Sample]*" \
            --hangdump --hangdump-timeout 5m --hangdump-type Heap \
            --results-directory ./TestResults

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-dumps-linux
          path: ./TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 7

      - name: Coverage summary
        run: |
          dotnet reportgenerator "-reports:TestResults/*.cobertura*.xml" \
            "-targetdir:CoverageReport" "-reporttypes:MarkdownSummaryGithub"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  # The suite has always run on Linux here and on every platform only at
  # release time, which is a bad place to learn that a test is
  # platform-specific: v0.3.0's tag run died on win-arm64 because a TLS
  # test raced a file lock, and the release had to be fixed and re-tagged.
  # This job is deliberately thinner than the Linux one — formatting,
  # analyzers and coverage are properties of the code rather than of the
  # operating system, so they stay where they are and are not paid for
  # twice. It also gives the Windows ACL test on the session file its
  # first CI coverage; that assertion could only ever run here.
  # win-arm64 runs too: v0.4.0's first tag run died there when the test
  # host crashed on a VISA finalizer that no x64 runner had triggered.
  deb-install-test:
    name: deb install test (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.apt == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            arch: amd64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The same self-contained single-file publish the release job makes.
      - name: Publish self-contained binary
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./artifacts/selfcontained

      - name: Build the package and install it with apt
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
          version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          sh packaging/apt/build-deb.sh ./artifacts/selfcontained "$version" ${{ matrix.arch }} ./artifacts/deb
          sh packaging/apt/install-test.sh ./artifacts/deb "$version" ${{ matrix.arch }}

  test-windows:
    name: test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit + architecture)
        run: >-
          dotnet test --no-build --configuration Release
          --filter "Category!=Integration"
          --hangdump --hangdump-timeout 5m --hangdump-type Heap
          --results-directory ./TestResults

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-dumps-${{ matrix.name }}
          path: ./TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 7
