name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  integration:
    name: integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        # When no integration tests match the filter the command exits non-zero;
        # tolerate that until the suite grows. Hardware-dependent tests run only
        # on self-hosted runners (not configured here).
        continue-on-error: true
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory ./TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.os }}
          path: ./TestResults

  dependency-scan:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Scan vulnerable packages
        shell: bash
        run: |
          set -e
          report=$(dotnet list package --vulnerable --include-transitive 2>&1 || true)
          echo "$report"
          if echo "$report" | grep -E -q '> [A-Za-z0-9\.]+\s+>.*High|> [A-Za-z0-9\.]+\s+>.*Critical'; then
            echo "::error::High or Critical vulnerability detected in dependencies."
            exit 1
          fi

      - name: Warn on deprecated packages
        run: dotnet list package --deprecated
