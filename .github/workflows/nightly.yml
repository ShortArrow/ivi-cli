name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  integration:
    name: integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The HiSLIP and VXI-11 interop tests drive the gateways from
      # PyVISA's pure-Python backend and skip when `import pyvisa` fails.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyVISA
        run: python -m pip install pyvisa==1.16.2 pyvisa-py==0.8.1

      - name: Integration tests
        # Tests that need NI-VISA or the USB mock bench skip here; they run
        # only where those are installed.
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory ./TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.os }}
          path: ./TestResults

  dependency-scan:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Scan vulnerable packages
        shell: bash
        run: |
          set -e
          report=$(dotnet list package --vulnerable --include-transitive 2>&1 || true)
          echo "$report"
          if echo "$report" | grep -E -q '> [A-Za-z0-9\.]+\s+>.*High|> [A-Za-z0-9\.]+\s+>.*Critical'; then
            echo "::error::High or Critical vulnerability detected in dependencies."
            exit 1
          fi

      - name: Warn on deprecated packages
        run: dotnet list package --deprecated
