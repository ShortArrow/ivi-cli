name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: version / tag / changelog guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Tag matches Version and has a CHANGELOG entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          props="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          if [ "$version" != "$props" ]; then
            echo "::error::pushed tag v$version does not match Directory.Build.props <Version> ($props). Bump the version before tagging."
            exit 1
          fi
          if ! grep -qF "## [$version]" docs/CHANGELOG.md; then
            echo "::error::docs/CHANGELOG.md has no '## [$version]' section for the release."
            exit 1
          fi
          echo "guard ok: tag v$version matches <Version> and has a CHANGELOG entry"

  publish:
    name: publish / ${{ matrix.os }}-${{ matrix.rid }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Each RID builds, tests, and smoke-runs on a runner of the SAME
      # OS/architecture, so every shipped binary has been executed at
      # least once before release (ADR 0016).
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit + architecture)
        run: |
          dotnet test --no-build --configuration Release --filter "Category!=Integration"

      - name: Compute version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained binary
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o ./artifacts/${{ matrix.rid }}-selfcontained

      - name: Publish framework-dependent binary
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.value }} \
            -o ./artifacts/${{ matrix.rid }}-fxdep

      # Execute the exact artifact that ships: the runner arch matches
      # the RID, so a publish that produces a non-runnable binary
      # (bad RID mapping, trimming fault, missing native lib) fails
      # here instead of on a user's machine.
      - name: Smoke-run published binary
        shell: bash
        run: |
          set -euo pipefail
          bin="./artifacts/${{ matrix.rid }}-selfcontained/ivicli"
          [ -f "$bin" ] || bin="${bin}.exe"
          out="$("$bin" --version)"
          echo "ivicli --version -> $out"
          case "$out" in
            "${{ steps.version.outputs.value }}"*)
              echo "smoke passed"
              ;;
            *)
              echo "smoke FAILED — expected version ${{ steps.version.outputs.value }}"
              exit 1
              ;;
          esac

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ivicli-${{ matrix.rid }}
          path: ./artifacts

  pack:
    name: dotnet tool pack & push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish
    permissions:
      id-token: write
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Pack
        run: |
          # Strip the leading `v` so v0.1.0 -> 0.1.0 for the NuGet
          # package version + assembly metadata. PackAsTool / PackageId
          # / ToolCommandName are declared in IviCli.Cli.csproj.
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release \
            -p:Version="${VERSION}" \
            -o ./artifacts/nupkg

      # Exchange the GitHub OIDC token for a short-lived (1h) nuget.org
      # API key via the trusted publisher policy registered under the
      # ShortArrow nuget.org account. Requires `permissions.id-token: write`
      # on this job and a matching policy at
      # https://www.nuget.org/account/trusted-publishing.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ShortArrow

      - name: Push to NuGet
        run: |
          dotnet nuget push './artifacts/nupkg/*.nupkg' \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ivicli-nupkg
          path: ./artifacts/nupkg

  # Native-arm64 counterpart of the amd64 smoke gate inside the
  # `docker` job below: builds the linux/arm64 single-arch image on an
  # arm64 runner and runs the same HEALTHCHECK + SCPI round-trip, so
  # the arm64 half of the multi-arch manifest is executed before the
  # push (ADR 0016). No QEMU — emulated .NET is slow and flaky.
  docker-smoke-arm64:
    name: docker / mock-VISA smoke (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download linux-arm64 self-contained artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ivicli-linux-arm64
          path: ./artifacts

      - name: Build single-arch (arm64) for smoke
        run: |
          docker build -f docker/Dockerfile \
            --build-arg RID=linux-arm64 \
            --tag ivi-cli-mock:smoke-arm64 .

      - name: Run smoke test
        run: sh docker/smoke-test.sh ivi-cli-mock:smoke-arm64

  docker:
    name: docker / mock-VISA container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [publish, docker-smoke-arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download linux-x64 self-contained artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ivicli-linux-x64
          path: ./artifacts

      - name: Download linux-arm64 self-contained artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ivicli-linux-arm64
          path: ./artifacts

      # OCI registries (ghcr.io included) require fully lowercase
      # repository names. GitHub's repository_owner preserves casing
      # (e.g. "ShortArrow"), so we lowercase it once here and expose
      # the full image reference as steps.tags.outputs.image for the
      # multi-arch push step below.
      - name: Compute image tags
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ivi-cli-mock"
          version="${{ github.ref_name }}"
          version_no_v="${version#v}"
          minor="$(echo "$version_no_v" | awk -F. '{print "v"$1"."$2}')"
          sha7="$(git rev-parse --short=7 HEAD)"
          {
            echo "image=$image"
            echo "version=$version"
            echo "minor=$minor"
            echo "sha7=sha-$sha7"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke gate (single-arch, native amd64) before pushing the
      # multi-arch manifest. dog-foods ivicli as the SCPI client
      # against its own gateway running inside the container.
      - name: Build single-arch (amd64) for smoke
        run: |
          docker build -f docker/Dockerfile \
            --build-arg RID=linux-x64 \
            --tag ivi-cli-mock:smoke .

      - name: Run smoke test
        run: sh docker/smoke-test.sh ivi-cli-mock:smoke

      - name: Build + push multi-arch manifest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The Dockerfile remaps the standard $TARGETARCH (amd64 /
          # arm64) to the matching .NET RID (linux-x64 / linux-arm64)
          # and selects the publish directory under ./artifacts/.
          # Both per-RID artifacts are staged earlier so each platform
          # build picks its own.
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.minor }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha7 }}
            ${{ steps.tags.outputs.image }}:latest
          # OCI annotations on the multi-arch index — the manifest GHCR reads
          # for the package description and repo link. A Dockerfile LABEL does
          # not reach the index for a multi-arch image, so they are set here.
          annotations: |
            index:org.opencontainers.image.title=ivi-cli-mock
            index:org.opencontainers.image.description=Scenario-driven mock VISA instrument (HiSLIP on 4880 + raw SOCKET on 5025) for testing SCPI clients without hardware. Built from ivi-cli.
            index:org.opencontainers.image.source=https://github.com/ShortArrow/ivi-cli
            index:org.opencontainers.image.licenses=MIT OR Apache-2.0

  release:
    name: github release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish, pack, docker]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Download only the artifacts we want attached to the GitHub
      # Release. The docker job uploads a buildx provenance
      # attestation as a side-effect artifact (named like
      # "<owner>~<repo>~XXX.dockerbuild", ~60 MB) which has no value
      # in the release page and historically times out the v4
      # download client; we filter it out with a pattern.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts
          pattern: ivicli-*

      # Bundle each per-RID self-contained directory into a single
      # archive so the Release page has one user-facing download per
      # platform instead of dozens of loose .dll / .pdb files. The
      # framework-dependent layout follows the same pattern but is
      # zipped separately so users who already have .NET installed
      # can grab the smaller artifact.
      - name: Bundle per-RID archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ./release-assets
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
            sc="./artifacts/ivicli-${rid}/${rid}-selfcontained"
            fx="./artifacts/ivicli-${rid}/${rid}-fxdep"
            if [ -d "$sc" ]; then
              (cd "$sc" && zip -qr "../../../release-assets/ivicli-${VERSION}-${rid}-selfcontained.zip" .)
            fi
            if [ -d "$fx" ]; then
              (cd "$fx" && zip -qr "../../../release-assets/ivicli-${VERSION}-${rid}-fxdep.zip" .)
            fi
          done
          # NuGet package: attach as-is (already a single file).
          if compgen -G "./artifacts/ivicli-nupkg/*.nupkg" > /dev/null; then
            cp ./artifacts/ivicli-nupkg/*.nupkg ./release-assets/
          fi
          ls -la ./release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ./release-assets/*
