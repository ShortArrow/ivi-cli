name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: publish / ${{ matrix.os }}-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit + architecture)
        run: |
          dotnet test --no-build --configuration Release --filter "Category!=Integration"

      - name: Compute version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained binary
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o ./artifacts/${{ matrix.rid }}-selfcontained

      - name: Publish framework-dependent binary
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.value }} \
            -o ./artifacts/${{ matrix.rid }}-fxdep

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ivicli-${{ matrix.rid }}
          path: ./artifacts

  pack:
    name: dotnet tool pack & push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish
    permissions:
      id-token: write
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Pack
        run: |
          # Strip the leading `v` so v0.1.0 -> 0.1.0 for the NuGet
          # package version + assembly metadata. PackAsTool / PackageId
          # / ToolCommandName are declared in IviCli.Cli.csproj.
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release \
            -p:Version="${VERSION}" \
            -o ./artifacts/nupkg

      # Exchange the GitHub OIDC token for a short-lived (1h) nuget.org
      # API key via the trusted publisher policy registered under the
      # ShortArrow nuget.org account. Requires `permissions.id-token: write`
      # on this job and a matching policy at
      # https://www.nuget.org/account/trusted-publishing.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ShortArrow

      - name: Push to NuGet
        run: |
          dotnet nuget push './artifacts/nupkg/*.nupkg' \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ivicli-nupkg
          path: ./artifacts/nupkg

  docker:
    name: docker / mock-VISA container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download linux-x64 self-contained artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ivicli-linux-x64
          path: ./artifacts

      - name: Download linux-arm64 self-contained artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ivicli-linux-arm64
          path: ./artifacts

      # OCI registries (ghcr.io included) require fully lowercase
      # repository names. GitHub's repository_owner preserves casing
      # (e.g. "ShortArrow"), so we lowercase it once here and expose
      # the full image reference as steps.tags.outputs.image for the
      # multi-arch push step below.
      - name: Compute image tags
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ivi-cli-mock"
          version="${{ github.ref_name }}"
          version_no_v="${version#v}"
          minor="$(echo "$version_no_v" | awk -F. '{print "v"$1"."$2}')"
          sha7="$(git rev-parse --short=7 HEAD)"
          {
            echo "image=$image"
            echo "version=$version"
            echo "minor=$minor"
            echo "sha7=sha-$sha7"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke gate (single-arch, native amd64) before pushing the
      # multi-arch manifest. dog-foods ivicli as the SCPI client
      # against its own gateway running inside the container.
      - name: Build single-arch (amd64) for smoke
        run: |
          docker build -f docker/Dockerfile \
            --build-arg RID=linux-x64 \
            --tag ivi-cli-mock:smoke .

      - name: Run smoke test
        run: |
          set -euo pipefail
          docker run -d --name mock-smoke -p 4880:4880 -p 5025:5025 ivi-cli-mock:smoke
          # Wait until the HEALTHCHECK reports healthy (max 30 s).
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mock-smoke)"
            if [ "$status" = "healthy" ]; then
              echo "container healthy after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' mock-smoke)" != "healthy" ]; then
            echo "container failed to become healthy"
            docker logs mock-smoke
            exit 1
          fi
          # SCPI round-trip over the SOCKET gateway (no client framing
          # required). Expect the baked default IDN response.
          response="$(docker exec mock-smoke bash -c 'echo "*IDN?" | nc -w 2 127.0.0.1 5025')"
          echo "got: $response"
          case "$response" in
            *IVICLI-MOCK*)
              echo "smoke passed"
              ;;
            *)
              echo "smoke FAILED — unexpected response"
              docker logs mock-smoke
              exit 1
              ;;
          esac
          docker rm -f mock-smoke

      - name: Build + push multi-arch manifest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The Dockerfile remaps the standard $TARGETARCH (amd64 /
          # arm64) to the matching .NET RID (linux-x64 / linux-arm64)
          # and selects the publish directory under ./artifacts/.
          # Both per-RID artifacts are staged earlier so each platform
          # build picks its own.
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.minor }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha7 }}
            ${{ steps.tags.outputs.image }}:latest

  release:
    name: github release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish, pack, docker]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Download only the artifacts we want attached to the GitHub
      # Release. The docker job uploads a buildx provenance
      # attestation as a side-effect artifact (named like
      # "<owner>~<repo>~XXX.dockerbuild", ~60 MB) which has no value
      # in the release page and historically times out the v4
      # download client; we filter it out with a pattern.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts
          pattern: ivicli-*

      # Bundle each per-RID self-contained directory into a single
      # archive so the Release page has one user-facing download per
      # platform instead of dozens of loose .dll / .pdb files. The
      # framework-dependent layout follows the same pattern but is
      # zipped separately so users who already have .NET installed
      # can grab the smaller artifact.
      - name: Bundle per-RID archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ./release-assets
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
            sc="./artifacts/ivicli-${rid}/${rid}-selfcontained"
            fx="./artifacts/ivicli-${rid}/${rid}-fxdep"
            if [ -d "$sc" ]; then
              (cd "$sc" && zip -qr "../../../release-assets/ivicli-${VERSION}-${rid}-selfcontained.zip" .)
            fi
            if [ -d "$fx" ]; then
              (cd "$fx" && zip -qr "../../../release-assets/ivicli-${VERSION}-${rid}-fxdep.zip" .)
            fi
          done
          # NuGet package: attach as-is (already a single file).
          if compgen -G "./artifacts/ivicli-nupkg/*.nupkg" > /dev/null; then
            cp ./artifacts/ivicli-nupkg/*.nupkg ./release-assets/
          fi
          ls -la ./release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ./release-assets/*
