name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish / ${{ matrix.os }}-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit + architecture)
        run: |
          dotnet test --no-build --configuration Release --filter "Category!=Integration"

      - name: Compute version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained binary
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o ./artifacts/${{ matrix.rid }}-selfcontained

      - name: Publish framework-dependent binary
        run: |
          dotnet publish src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.value }} \
            -o ./artifacts/${{ matrix.rid }}-fxdep

      - name: Upload binaries
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ivicli-${{ matrix.rid }}
          path: ./artifacts

  pack:
    name: dotnet tool pack & push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Pack
        run: |
          # Strip the leading `v` so v0.1.0 -> 0.1.0 for the NuGet
          # package version + assembly metadata.
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/IviCli.Cli/IviCli.Cli.csproj \
            -c Release \
            -p:PackAsTool=true \
            -p:ToolCommandName=ivicli \
            -p:Version="${VERSION}" \
            -o ./artifacts/nupkg

      - name: Push to NuGet
        if: ${{ env.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push './artifacts/nupkg/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ivicli-nupkg
          path: ./artifacts/nupkg

  docker:
    name: docker / mock-VISA container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ivi-cli-mock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download linux-x64 self-contained artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ivicli-linux-x64
          path: ./artifacts

      - name: Download linux-arm64 self-contained artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ivicli-linux-arm64
          path: ./artifacts

      - name: Compute image tags
        id: tags
        run: |
          version="${{ github.ref_name }}"
          version_no_v="${version#v}"
          minor="$(echo "$version_no_v" | awk -F. '{print "v"$1"."$2}')"
          sha7="$(git rev-parse --short=7 HEAD)"
          {
            echo "version=$version"
            echo "minor=$minor"
            echo "sha7=sha-$sha7"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Log in to ghcr.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke gate (single-arch, native amd64) before pushing the
      # multi-arch manifest. dog-foods ivicli as the SCPI client
      # against its own gateway running inside the container.
      - name: Build single-arch (amd64) for smoke
        run: |
          docker build -f docker/Dockerfile \
            --build-arg RID=linux-x64 \
            --tag ivi-cli-mock:smoke .

      - name: Run smoke test
        run: |
          set -euo pipefail
          docker run -d --name mock-smoke -p 4880:4880 -p 5025:5025 ivi-cli-mock:smoke
          # Wait until the HEALTHCHECK reports healthy (max 30 s).
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mock-smoke)"
            if [ "$status" = "healthy" ]; then
              echo "container healthy after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' mock-smoke)" != "healthy" ]; then
            echo "container failed to become healthy"
            docker logs mock-smoke
            exit 1
          fi
          # SCPI round-trip over the SOCKET gateway (no client framing
          # required). Expect the baked default IDN response.
          response="$(docker exec mock-smoke bash -c 'echo "*IDN?" | nc -w 2 127.0.0.1 5025')"
          echo "got: $response"
          case "$response" in
            *IVICLI-MOCK*)
              echo "smoke passed"
              ;;
            *)
              echo "smoke FAILED — unexpected response"
              docker logs mock-smoke
              exit 1
              ;;
          esac
          docker rm -f mock-smoke

      - name: Build + push multi-arch manifest
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The Dockerfile remaps the standard $TARGETARCH (amd64 /
          # arm64) to the matching .NET RID (linux-x64 / linux-arm64)
          # and selects the publish directory under ./artifacts/.
          # Both per-RID artifacts are staged earlier so each platform
          # build picks its own.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.minor }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha7 }}
            ${{ env.IMAGE_NAME }}:latest

  release:
    name: github release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish, pack, docker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: ./artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ./artifacts/**/*
