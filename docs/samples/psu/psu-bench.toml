# PSU (DC power supply) mock scenario — v0.2.0 FSM shape.
#
# Two states: `off` and `on`. `OUTP ON` from `off` transitions to
# `on`; `OUTP OFF` from `on` transitions back. `OUTP?` answers 0 or
# 1 according to the current state. Static metadata (`*IDN?`, `*RST`,
# voltages, currents, errors) is duplicated in both scenes because
# v0.2.0 scenes do not share rule sets (key-value variable state is
# a separate, future feature — see issue #26 §"Out of scope").
#
# Typical install:
#   cp docs/samples/psu/psu-bench.toml \
#      ~/.config/ivi-cli/scenarios/psu-bench.toml
#   ivicli mock scenario activate psu-bench
#
# Or, for the mock container:
#   docker run -v $PWD/docs/samples/psu:/etc/ivi-cli/scenarios \
#              -e IVICLI_SCENARIO=psu-bench \
#              -p 4880:4880 -p 5025:5025 \
#              ghcr.io/shortarrow/ivi-cli-mock:latest

idn = "IVICLI-MOCK,PSU,SN0001,1.0.0"
initial_scene = "off"

# ===================== off =====================
[[scenes]]
name = "off"

[[scenes.rules]]
match = "*IDN?"
respond = "IVICLI-MOCK,PSU,SN0001,1.0.0"

[[scenes.rules]]
match = "*RST"
ack = true
transition_to = "off"

[[scenes.rules]]
match = "*OPC?"
respond = "1"

[[scenes.rules]]
match = "OUTP?"
respond = "0"

[[scenes.rules]]
match = "OUTP ON"
ack = true
transition_to = "on"

[[scenes.rules]]
match = "OUTP OFF"
ack = true

[[scenes.rules]]
match = "VOLT 5.0"
ack = true

[[scenes.rules]]
match = "VOLT?"
respond = "5.000"

[[scenes.rules]]
match = "CURR 1.0"
ack = true

[[scenes.rules]]
match = "CURR?"
respond = "1.000"

# When the output is off, measured values are essentially zero
# (instrument's noise floor); model that here.
[[scenes.rules]]
match = "MEAS:VOLT?"
respond = "0.001"

[[scenes.rules]]
match = "MEAS:CURR?"
respond = "0.000"

[[scenes.rules]]
match = "SYST:ERR?"
respond = "0,\"No error\""

# ===================== on =====================
[[scenes]]
name = "on"

[[scenes.rules]]
match = "*IDN?"
respond = "IVICLI-MOCK,PSU,SN0001,1.0.0"

[[scenes.rules]]
match = "*RST"
ack = true
transition_to = "off"

[[scenes.rules]]
match = "*OPC?"
respond = "1"

[[scenes.rules]]
match = "OUTP?"
respond = "1"

[[scenes.rules]]
match = "OUTP ON"
ack = true

[[scenes.rules]]
match = "OUTP OFF"
ack = true
transition_to = "off"

[[scenes.rules]]
match = "VOLT 5.0"
ack = true

[[scenes.rules]]
match = "VOLT?"
respond = "5.000"

[[scenes.rules]]
match = "CURR 1.0"
ack = true

[[scenes.rules]]
match = "CURR?"
respond = "1.000"

[[scenes.rules]]
match = "MEAS:VOLT?"
respond = "4.998"

[[scenes.rules]]
match = "MEAS:CURR?"
respond = "0.823"

[[scenes.rules]]
match = "SYST:ERR?"
respond = "0,\"No error\""
